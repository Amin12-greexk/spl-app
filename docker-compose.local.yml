# Local-only Postgres for SPL development & testing.
# NEVER point production env at this. Start with:
#   docker compose -f docker-compose.local.yml up -d
# Connection (local):
#   DATABASE_URL=postgresql://spl:spl_local_pw@localhost:55432/spldb?schema=public
#   SHADOW_DATABASE_URL=postgresql://spl:spl_local_pw@localhost:55432/spldb_shadow?schema=public
services:
  spl_local_pg:
    image: postgres:16-alpine
    container_name: spl_local_pg
    environment:
      POSTGRES_USER: spl
      POSTGRES_PASSWORD: spl_local_pw
      POSTGRES_DB: spldb
    ports:
      - "55432:5432"
    volumes:
      - spl_local_pgdata:/var/lib/postgresql/data
      - ./scripts/local-db-init:/docker-entrypoint-initdb.d:ro
volumes:
  spl_local_pgdata:
